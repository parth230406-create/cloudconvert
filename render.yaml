services:
  - type: web
    name: cloudconvert
    env: node
    region: oregon
    plan: free
    buildCommand: |
      cd client && npm install && npm run build && cd ..
      cd server && npm install
    startCommand: cd server && NODE_OPTIONS="--max-old-space-size=400" node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOAD_DIR
        value: ./uploads
      - key: OUTPUT_DIR
        value: ./outputs
      - key: MAX_FILE_SIZE
        value: 26214400
      - key: FILE_CLEANUP_INTERVAL
        value: 900000
    healthCheckPath: /api/health
    autoDeploy: true
version: "3.8"

services:
  # Backend Server
  server:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: cloudconvert-server
    ports:
      - "5000:5000"
    volumes:
      - ./server:/app/server
      - /app/server/node_modules
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MAX_FILE_SIZE=26214400
    restart: unless-stopped

  # Frontend Client
  client:
    image: node:18-alpine
    container_name: cloudconvert-client
    working_dir: /app/client
    ports:
      - "3000:3000"
    volumes:
      - ./client:/app/client
      - /app/client/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm start"
    depends_on:
      - server
    restart: unless-stopped
